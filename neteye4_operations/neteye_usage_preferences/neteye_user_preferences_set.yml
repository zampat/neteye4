# Ansible to verify content and add lines
#

- name: Check file for specific strings
  hosts: localhost
  gather_facts: false
  vars_files:
    - config.yml  # Load variables from the config file
  tasks:
    - name: Search files for corresponding strings
      command: grep -q "{{ item.string }}" "{{ item.file }}"
      register: grep_result
      ignore_errors: yes
      loop: "{{ search_data }}"

    - name: Display results
      debug:
        msg: >
          The string '{{ item.string }}' was found in '{{ item.file }}'
      when: grep_result.results[item_index].rc == 0
      loop: "{{ search_data }}"
      loop_control:
        index_var: item_index

    - name: Add missing string line
      lineinfile:
        path: "{{ item.file }}"
        line: "{{ item.string_insert }}"
      when: grep_result.results[item_index].rc != 0
      loop: "{{ search_data }}"
      loop_control:
        index_var: item_index

    - name: Reload session variables from .bashrc
      shell: source ~/.bashrc
      args:
        executable: /bin/bash
      register: reload_result
